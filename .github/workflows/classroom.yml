name: Autograding Tests
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [autograde]

permissions:
  checks: write
  actions: read
  contents: read
  
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: test_challenge4.py
      id: test_challenge4-py
      uses: classroom-resources/autograding-python-grader@v1
      with:
        timeout: 10
        max-score: 9
        setup-command: |
          pip install -r requirements.txt
          jupyter nbconvert --to python challenge-4.ipynb --output challenge_4_export.py
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST_CHALLENGE4-PY_RESULTS: "${{steps.test_challenge4-py.outputs.result}}"
      with:
        runners: test_challenge4-py
